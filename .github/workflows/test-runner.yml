name: Betsson Intelligent Game Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        market: [betsson_com, betsson_pe] # Corre ambos mercados en paralelo

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Tesseract OCR)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng

    - name: Install Python Dependencies & Playwright Browsers
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps

    - name: Execute Tests for ${{ matrix.market }}
      env:
        TARGET_MARKET: ${{ matrix.market }}
        BETSSON_USER: ${{ matrix.market == 'betsson_com' && secrets.BETSSON_COM_USER || secrets.BETSSON_PE_USER }}
        BETSSON_PASS: ${{ matrix.market == 'betsson_com' && secrets.BETSSON_COM_PASS || secrets.BETSSON_PE_PASS }}
        BETSSON_NOFUND_USER: ${{ matrix.market == 'betsson_com' && secrets.BETSSON_COM_NOFUND_USER || secrets.BETSSON_PE_NOFUND_USER }}
        BETSSON_NOFUND_PASS: ${{ matrix.market == 'betsson_com' && secrets.BETSSON_COM_NOFUND_PASS || secrets.BETSSON_PE_NOFUND_PASS }}
      run: |
        pytest --html=report_${{ matrix.market }}.html --self-contained-html || true

    - name: Upload Test Report & Screenshots Artifacts
      if: always() # Guarda las evidencias siempre, incluso si falla el test[cite: 4]
      uses: actions/upload-artifact@v4
      with:
        name: report-${{ matrix.market }}
        path: |
          report_*.html
          screenshots/
          videos/